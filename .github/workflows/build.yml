name: Build

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, dev ]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libopenjp2-7
          sudo snap install snapcraft --classic

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: pnpm run build:mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run build:linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: such-pc-ng-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
          retention-days: 5

  # 仅在推送 v* 标签时运行：汇总各平台构建产物并自动生成 release。
  # 每次都基于最新产物全新重建 release（先删除该 tag 已存在的旧 release），
  # 确保二进制安装包始终被挂载，避免"release 已存在则跳过上传"导致的空 release。
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 直接下载 git-cliff 预编译二进制生成 release 正文，
      # 避免使用 Docker 容器化 action（orhun/git-cliff-action）在 runner 上构建镜像失败
      - name: Generate release notes
        id: git-cliff
        shell: bash
        run: |
          set -euo pipefail
          CLIFF_VERSION="2.13.1"
          curl -sSL "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/git-cliff.tar.gz
          mkdir -p /tmp/git-cliff
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp/git-cliff
          /tmp/git-cliff/git-cliff-${CLIFF_VERSION}/git-cliff \
            --config cliff.toml --latest --strip header > /tmp/release-notes.md
          {
            echo "content<<GIT_CLIFF_BODY_EOF"
            cat /tmp/release-notes.md
            echo "GIT_CLIFF_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 删除该 tag 已存在的旧 release，确保重建时附件总是全新挂载
      - name: Delete existing release for this tag
        shell: bash
        run: gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}