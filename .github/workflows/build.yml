name: Build

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, dev ]

permissions:
  contents: write

jobs:
  # 检测当前 tag 对应的 release 是否已存在，用于决定是否还需要重新构建打包
  check:
    name: Check release exists
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check existing release
        id: check
        shell: bash
        run: |
          # 通过 API 读取 release/tags/<tag>，返回 200 表示该 tag 的 release 已存在
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          echo "release_http_code=$HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build on ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    # 非 tag 推送始终构建；tag 推送仅当其 release 尚未创建（需打包）时才构建。
    # 若 release 已存在，则跳过打包，避免重复构建。
    if: ${{ !startsWith(github.ref, 'refs/tags/') || needs.check.outputs.release_exists == 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libopenjp2-7
          sudo snap install snapcraft --classic

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: pnpm run build:mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run build:linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: such-pc-ng-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
          retention-days: 5

  # 仅在推送 v* 标签时运行：汇总各平台构建产物并自动生成 release 正文。
  # 若 release 已存在（无需重新打包），则仅更新其内容（正文），保留已有产物。
  release:
    name: Release
    needs: [check, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 直接下载 git-cliff 预编译二进制生成 release 正文，
      # 避免使用 Docker 容器化 action（orhun/git-cliff-action）在 runner 上构建镜像失败
      - name: Generate release notes
        id: git-cliff
        shell: bash
        run: |
          set -euo pipefail
          CLIFF_VERSION="2.13.1"
          curl -sSL "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/git-cliff.tar.gz
          mkdir -p /tmp/git-cliff
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp/git-cliff
          /tmp/git-cliff/git-cliff-${CLIFF_VERSION}/git-cliff \
            --config cliff.toml --latest --strip header > /tmp/release-notes.md
          {
            echo "content<<GIT_CLIFF_BODY_EOF"
            cat /tmp/release-notes.md
            echo "GIT_CLIFF_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        if: needs.check.outputs.release_exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          # 仅在需要打包时上传新产物；release 已存在时留空，仅更新正文、保留已有产物
          files: ${{ needs.check.outputs.release_exists == 'false' && 'dist/*.exe dist/*.dmg dist/*.AppImage dist/*.snap dist/*.deb dist/*.yml dist/*.blockmap' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}