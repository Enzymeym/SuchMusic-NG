name: 💡 功能建议
description: 提出新功能、改进点或体验优化
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。比起「想要 X 功能」，更希望了解**你现在遇到的问题**——往往有更轻量的解法。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与痛点
      description: 在做什么事情的时候觉得不方便？现在只能怎么绕过去？
      placeholder: 例如：我有几千首本地曲库，想按「最近两周没听过」筛一遍，现在只能手动翻。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？界面上放在哪里比较顺手？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 其他播放器是怎么做的？有没有你不想采用的方式？

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 播放 / 播放控制
        - 音频引擎与音效
        - 智能过渡（Morphaeum）
        - 歌词
        - 歌单
        - 本地曲库 / 扫描
        - 搜索
        - 音源插件（洛雪 / 澜音）
        - 应用插件
        - 界面与布局
        - 更新与安装
        - 其他
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 参考截图、类似产品的实现、优先级想法等

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，确认这不是重复建议
          required: true
