appId: com.mym.suchmusic
productName: Such Music
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  # 将 resources/native 目录下编译好的 .node/.dll 二进制文件拷贝到 resources/native
  - from: resources/native
    to: native
    filter:
      - '*.node'
      - '*.dll'
win:
  executableName: such-pc-ng
  target:
    - target: nsis
      arch: [x64]
    - target: appx
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
appx:
  applicationId: SuchMusic
  identityName: 37539Enzymeym.SuchMusic
  publisher: CN=Enzymeym
  publisherDisplayName: Enzymeym
  backgroundColor: '#1a1a2e'
  showNameOnTiles: true
  languages:
    - zh-CN
    - en-US
  # 正式提交商店时，在此指定从合作伙伴中心下载的 .pfx 证书
  # certificateFile: build/certificate.pfx
  # certificatePassword: your-password
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
